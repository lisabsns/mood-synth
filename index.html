<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>внутренняя погода</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/tone@15"></script>
    <script src="script.js"></script>
  </head>

  <body data-weather="fog" data-playing="false">
    <div class="Station">
      <!-- панель -->
      <header class="Header">
        <div class="Logo">
          <h1 class="Logo__name">внутренняя погода</h1>
          <p class="Logo__note">метеостанция настроения</p>
        </div>

        <div class="WeatherSwitch" role="radiogroup" aria-label="погода">
          <button
            class="WeatherSwitch__option"
            data-weather-option="fog"
            role="radio"
            aria-checked="true"
          >
            туман
          </button>
          <button
            class="WeatherSwitch__option"
            data-weather-option="drizzle"
            role="radio"
            aria-checked="false"
          >
            морось
          </button>
          <button
            class="WeatherSwitch__option"
            data-weather-option="storm"
            role="radio"
            aria-checked="false"
          >
            гроза
          </button>
          <button
            class="WeatherSwitch__option"
            data-weather-option="clear"
            role="radio"
            aria-checked="false"
          >
            ясно
          </button>
        </div>

        <div class="Time">
          <span class="Time__label">время</span>
          <div class="Steps" id="steps"></div>
        </div>

        <button class="StartButton" id="startButton">
          <span class="StartButton__icon" aria-hidden="true"></span>
          <span class="StartButton__text" id="startText">старт</span>
        </button>
      </header>

      <!-- небо -->
      <section class="Sky" id="sky" aria-label="небо">
        <div class="Sky__weather">
          <div class="Sky__layer Sky__layer--still">
            <span class="Cloud Cloud--a"></span>
            <span class="Cloud Cloud--b"></span>
            <span class="Cloud Cloud--c"></span>
          </div>
          <div class="Sky__layer Sky__layer--fog">
            <span class="Cloud Cloud--a"></span>
            <span class="Cloud Cloud--b"></span>
            <span class="Cloud Cloud--c"></span>
            <span class="Cloud Cloud--d"></span>
          </div>
          <div class="Sky__layer Sky__layer--drizzle">
            <span class="Cloud Cloud--a"></span>
            <span class="Cloud Cloud--b"></span>
            <span class="Cloud Cloud--c"></span>
            <span class="Cloud Cloud--d"></span>
          </div>
          <div class="Sky__layer Sky__layer--storm">
            <span class="Cloud Cloud--a"></span>
            <span class="Cloud Cloud--b"></span>
            <span class="Cloud Cloud--c"></span>
            <span class="Cloud Cloud--d"></span>
          </div>
          <div class="Sky__layer Sky__layer--clear">
            <span class="Cloud Cloud--a"></span>
            <span class="Cloud Cloud--b"></span>
            <span class="Cloud Cloud--c"></span>
            <span class="Cloud Cloud--d"></span>
          </div>
        </div>
        <svg
          class="Sky__isobars"
          id="isobars"
          viewBox="0 0 1000 400"
          preserveAspectRatio="xMidYMid slice"
          aria-hidden="true"
        ></svg>
        <div class="Sky__grain" aria-hidden="true"></div>

        <div class="Forecast">
          <p class="Forecast__weather" id="forecastWeather">туман</p>
          <p class="Forecast__tempo" id="forecastTempo">тишина</p>
        </div>
        <p class="Sky__hint" id="skyHint">
          нажми «старт», чтобы услышать погоду
        </p>
      </section>

      <!-- приборы -->
      <main class="Instruments">
        <!-- капли -->
        <section class="Instrument Instrument--drops" data-target="drops">
          <header class="Instrument__head">
            <div class="Instrument__title">
              <h2 class="Instrument__name">капли</h2>
              <p class="Instrument__role">синт 1</p>
            </div>
            <span
              class="Lamp Lamp--drop"
              data-lamp="drops"
              aria-hidden="true"
            ></span>
            <button
              class="Mute"
              data-mute="drops"
              aria-pressed="true"
              aria-label="капли включены"
            ></button>
          </header>
          <div class="WavePicker" data-wave="drops"></div>
          <div class="Instrument__controls">
            <div
              class="Knob Knob--xl"
              data-param="dropsVolume"
              data-value="0.8"
              data-label="сила"
            ></div>
            <div
              class="Knob"
              data-param="dropsHumidity"
              data-value="0.3"
              data-label="влажность"
            ></div>
          </div>
        </section>

        <!-- облака -->
        <section class="Instrument Instrument--clouds" data-target="clouds">
          <header class="Instrument__head">
            <div class="Instrument__title">
              <h2 class="Instrument__name">облака</h2>
              <p class="Instrument__role">синт 2</p>
            </div>
            <span
              class="Lamp Lamp--cloud"
              data-lamp="clouds"
              aria-hidden="true"
            ></span>
            <button
              class="Mute"
              data-mute="clouds"
              aria-pressed="true"
              aria-label="облака включены"
            ></button>
          </header>
          <div class="WavePicker" data-wave="clouds"></div>
          <div class="Instrument__controls">
            <div
              class="Fader"
              data-param="cloudsVolume"
              data-value="0.8"
              data-label="сила"
            ></div>
            <div
              class="Knob Knob--lg"
              data-param="cloudsFog"
              data-value="0.5"
              data-label="туман"
            ></div>
          </div>
        </section>

        <!-- ветер -->
        <section class="Instrument Instrument--wind" data-target="wind">
          <header class="Instrument__head">
            <div class="Instrument__title">
              <h2 class="Instrument__name">ветер</h2>
              <p class="Instrument__role">барабаны</p>
            </div>
            <button
              class="Mute"
              data-mute="wind"
              aria-pressed="true"
              aria-label="ветер включён"
            ></button>
          </header>
          <div class="Gusts" aria-hidden="true">
            <span class="Gust"
              ><span class="Lamp" data-lamp="windKick"></span>бочка</span
            >
            <span class="Gust"
              ><span class="Lamp" data-lamp="windClap"></span>клэп</span
            >
            <span class="Gust"
              ><span class="Lamp" data-lamp="windHat"></span>хэт</span
            >
          </div>
          <div class="Instrument__controls">
            <div
              class="Fader"
              data-param="windVolume"
              data-value="0.8"
              data-label="сила"
            ></div>
            <div
              class="Knob"
              data-param="windGusts"
              data-value="0.8"
              data-label="порывы"
            ></div>
            <div
              class="Knob"
              data-param="storm"
              data-value="0"
              data-label="гроза"
            ></div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
